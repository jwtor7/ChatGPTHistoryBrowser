name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  privacy:
    name: Privacy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job intentionally uses the runner-provided Node.js. No dependency
      # installation or project code execution occurs before both scans pass.
      - name: Scan tracked source
        run: node scripts/privacy/audit-repo.mjs tracked

      - name: Scan every reachable Git object
        run: node scripts/privacy/audit-git-objects.mjs

  quality:
    name: macOS quality, security, and package
    needs: privacy
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Set up Rust
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify and fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and synthetic tests
        run: npm test

      - name: Run security regression tests
        run: npm run test:security

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build release-mode source
        run: npm run build

      - name: Build macOS application package
        run: npm run tauri:build

      - name: Scan generated build output
        run: |
          node scripts/privacy/audit-repo.mjs build
          npm run privacy:package

  e2e:
    name: Synthetic browser E2E
    needs: privacy
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run synthetic-data browser tests
        run: npm run test:e2e
